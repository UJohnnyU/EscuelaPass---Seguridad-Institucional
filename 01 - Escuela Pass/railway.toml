# Despliegue del backend Nest en Railway (Opción A: API en Railway, frontend en Vercel).
# En el dashboard: New Project → Deploy from GitHub → Root Directory = esta carpeta ("01 - Escuela Pass").
# Añade Postgres al proyecto y enlaza DATABASE_URL al servicio web.
#
# Persistencia de archivos subidos (avatares, logos de institución, comprobantes
# de pago, justificantes de ausencia): crea un "Volume" en Railway y móntalo en
# /data, luego define la variable UPLOADS_DIR=/data en el servicio. Con eso los
# archivos sobreviven a redeploys.

[build]
builder = "NIXPACKS"

[deploy]
# Al arranque el backend ejecuta migraciones TypeORM pendientes (dist/database/migrations/*.js)
# y luego ensureRuntimeSchema. No hace falta releaseCommand separado para columnas nuevas.
startCommand = "npm run start:prod"
restartPolicyType = "ON_FAILURE"
# Recomendación: configura manualmente un Volume de 1GB montado en /data y
# UPLOADS_DIR=/data en las variables del servicio. El código migra los archivos
# antiguos de ./uploads al volumen en el primer arranque.
# Opcional: define un health check HTTP en el panel de Railway apuntando a GET /api/v1/health
# (o /api según tu prefijo global) para reinicios automáticos si el proceso queda colgado.
